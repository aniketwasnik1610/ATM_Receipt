<!DOCTYPE html>
<html>
<head>
<title>ATM Website</title>

<style>
body{
  background:#e9edf0;
  font-family:Arial, sans-serif;
}
.box{
  width:340px;
  margin:40px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
h2{text-align:center;}
label{font-size:14px;}
input{
  width:100%;
  padding:8px;
  margin:6px 0 12px;
}
button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#0a84ff;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button.print{background:#34c759;}
.receipt{
  border:1px dashed #aaa;
  padding:15px;
  font-family:"Courier New";
}
.row{
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}
.line{
  border-top:1px dashed #aaa;
  margin:8px 0;
}
.center{text-align:center;}
</style>
</head>

<body>

<!-- PIN SCREEN -->
<div class="box" id="pinScreen">
  <h2>ATM LOGIN</h2>
  <label>Enter PIN</label>
  <input type="password" id="pin" maxlength="4">
  <button onclick="checkPin()">ENTER</button>
</div>

<!-- ATM SCREEN -->
<div class="box" id="atmScreen" style="display:none">
  <h2>ATM</h2>
  <div><b>Account Balance:</b> ₹ <span id="balanceText"></span></div>
  <label>Withdraw Amount</label>
  <input type="number" id="withdraw">
  <button onclick="withdrawMoney()">WITHDRAW</button>
  <p id="atmMsg" style="color:red;"></p>
</div>

<!-- RECEIPT -->
<div class="box" id="receiptScreen" style="display:none">
  <h2>ATM RECEIPT</h2>

  <div class="receipt" id="printArea">
    <div class="center"><b>ABC BANK</b></div>
    <div class="center">ATM TRANSACTION</div>

    <div class="line"></div>

    <div class="row"><span>Date</span><span id="rDate"></span></div>
    <div class="row"><span>Time</span><span id="rTime"></span></div>
    <div class="row"><span>Account</span><span>XXXX-XXXX-1234</span></div>

    <div class="line"></div>

    <div class="row"><span>Main Balance</span><span id="rMain"></span></div>
    <div class="row"><span>Withdrawn</span><span id="rWithdraw"></span></div>

    <div class="line"></div>

    <div class="row"><b>Remaining</b><b id="rRemain"></b></div>

    <div class="line"></div>
    <div class="center">THANK YOU FOR USING ATM</div>
  </div>

  <button class="print" onclick="printAndEmail()">PRINT & EMAIL RECEIPT</button>
</div>

<!-- ✅ EMAILJS v4 -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init({
  publicKey: "D-kHQ5zE7O3T0t419"
});
</script>

<script>
let correctPin = "1234";
let balance = 20000;
let attempts = 3;
const RECEIVER_EMAIL = "22071167@ycce.in";

// PIN CHECK
function checkPin(){
  let enteredPin = document.getElementById("pin").value;

  if(enteredPin === correctPin){
    pinScreen.style.display="none";
    atmScreen.style.display="block";
    balanceText.innerText = balance;
  } else {
    attempts--;
    alert("Wrong PIN! Attempts left: " + attempts);
    if(attempts === 0){
      pinScreen.innerHTML = "<h2>ACCOUNT BLOCKED</h2><p>Please contact bank.</p>";
    }
  }
}

// WITHDRAW
function withdrawMoney(){
  let amount = parseInt(withdraw.value);

  if(!amount || amount <= 0){
    atmMsg.innerText = "Enter valid amount";
    return;
  }
  if(amount > balance){
    atmMsg.innerText = "Insufficient balance";
    return;
  }

  let oldBalance = balance;
  balance -= amount;

  atmScreen.style.display="none";
  receiptScreen.style.display="block";

  let now = new Date();
  rDate.innerText = now.toLocaleDateString();
  rTime.innerText = now.toLocaleTimeString();
  rMain.innerText = "₹ " + oldBalance;
  rWithdraw.innerText = "₹ " + amount;
  rRemain.innerText = "₹ " + balance;
}

// PRINT + EMAIL
function printAndEmail(){
  let params = {
    to_email: RECEIVER_EMAIL,
    date: rDate.innerText,
    time: rTime.innerText,
    account: "XXXX-XXXX-1234",
    main_balance: rMain.innerText,
    withdrawn: rWithdraw.innerText,
    remaining: rRemain.innerText
  };

  emailjs.send("service_od68gaj", "template_tyccrqr", params)
    .then(() => alert("Receipt emailed successfully!"))
    .catch(err => console.error("EmailJS Error:", err));

  window.print();
}
</script>

</body>
</html>
